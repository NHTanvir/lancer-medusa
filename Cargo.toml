[package]
name = "lancer-medusa"
version = "0.1.0"
edition = "2021"
description = "Rust clone of medusa — part of the Lancer bug bounty toolkit"
authors = ["NHTanvir <naymulhasantanvir10@gmail.com>"]
license = "MIT"
repository = "https://github.com/NHTanvir/lancer-medusa"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
revm = { version = "14", features = ["std"] }
alloy-primitives = "0.8"
alloy-json-abi = "0.8"
alloy-sol-types = "0.8"
rayon = "1"
dashmap = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
